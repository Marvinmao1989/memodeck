[package]
name = "memodeck"
version = "0.1.0"
description = "Windows 桌面悬浮备忘录"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "memodeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 绿色版分发的是单个 exe，关掉符号和调试信息能省好几 MB
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
